<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>LifeBlood - Blood Donation Platform | Save Lives</title>
    <meta name="title" content="LifeBlood - Blood Donation Platform" />
    <meta
      name="description"
      content="Connect with blood donors and save lives. LifeBlood is the modern platform for blood donation requests, donor management, and life-saving connections."
    />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lifeblood.com/" />
    <meta property="og:title" content="LifeBlood - Blood Donation Platform" />
    <meta
      property="og:description"
      content="Connect with blood donors and save lives. Join our community of heroes today."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://lifeblood.com/" />
    <meta property="twitter:title" content="LifeBlood - Blood Donation Platform" />
    <meta
      property="twitter:description"
      content="Connect with blood donors and save lives. Join our community of heroes today."
    />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#dc2626" />
    <meta name="msapplication-TileColor" content="#dc2626" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
